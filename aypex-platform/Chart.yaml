apiVersion: v2
name: aypex-platform
description: >-
  aypex.tech own-brand storefront umbrella — Spree 5.6 backend (rails) + a single
  Next.js app that serves the storefront, the commerce surfaces AND the colocated
  Payload CMS admin, on one CNPG cluster holding two databases (spree, payload)
  plus Dragonfly instances for Sidekiq and Rails.cache. Single brand (not a
  per-customer fan-out); stg + prd envs, consumed by the gitops brands/tech
  overlays.
type: application
version: 0.1.10
appVersion: "1.0.0"
dependencies:
  - name: common
    version: 2.41.0
    repository: oci://registry-1.docker.io/bitnamicharts
  - name: rails-server
    version: 0.2.2
    alias: web
    repository: oci://ghcr.io/aypex-io/charts
  - name: rails-server
    version: 0.2.2
    alias: worker
    repository: oci://ghcr.io/aypex-io/charts
  - name: rails-task
    version: 0.1.2
    alias: migrate
    repository: oci://ghcr.io/aypex-io/charts
  - name: rails-task
    version: 0.1.2
    alias: seed
    repository: oci://ghcr.io/aypex-io/charts
  - name: rails-task
    version: 0.1.2
    alias: rake
    repository: oci://ghcr.io/aypex-io/charts
  # ONE Next.js workload, not the storefront+cms pair spree-platform deploys:
  # the Payload admin is colocated in the same app, so there is a single image
  # and a single Deployment.
  - name: nextjs
    version: 0.1.4
    alias: site
    repository: oci://ghcr.io/aypex-io/charts
