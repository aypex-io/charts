{{/*
Materialise this brand's secret material into namespace Secrets.

Two ASM source patterns:

  • ONE consolidated bundle -- N27a/aypex-tech (asmKeys.bundle). Holds every
    app secret under flat, env-neutral keys; there is one AWS account per
    environment, so nothing carries an env suffix. Each ExternalSecret below
    extracts that single bundle and picks out the keys it needs, remapping
    them to the names the workloads expect.

  • Per-env service-user bundles (IAM access keys) -- already env-scoped, and
    mapped straight through with no renaming.

Ordering matters: the CNPG Cluster will not bootstrap until the Secret its
`passwordSecret` points at exists, so every one of these carries sync-wave -10.

Adding a key later is NOT free: the terraform ASM secret carries
`ignore_changes = [secret_string]`, so a plain apply will silently skip a newly
added key. Either -replace the secret version or put-secret-value it by hand.
*/}}

{{- if .Values.externalSecrets.asmKeys.bundle }}
{{- /*
Spree Rails secrets.

  JWT_SECRET_KEY  Spree signs Store API customer JWTs with this. Without it
                  Spree falls back to SECRET_KEY_BASE, coupling session
                  validity to a value we may need to rotate for other reasons.
  ADMIN_*         Consumed by the db:seed Job's create-only super-admin step.
                  Devise requires 12+ characters here -- Spree's own seed
                  default is 8 and fails validation.
  STRIPE_SECRET_* Lives ONLY in the Rails process. The Next.js app gets the
                  publishable key and never this one.
*/}}
{{ include "aypex.bundleSecret" (dict
  "name" "spree-rails"
  "data" (dict
    "SECRET_KEY_BASE" "secret_key_base"
    "JWT_SECRET_KEY" "jwt_secret_key"
    "ADMIN_EMAIL" "admin_email"
    "ADMIN_PASSWORD" "admin_password"
    "STRIPE_SECRET_KEY" "stripe_secret_key"
    "STRIPE_PUBLISHABLE_KEY" "stripe_publishable_key"
    "STRIPE_WEBHOOK_SECRET" "stripe_webhook_secret")
  "context" $) }}
---
{{ include "aypex.bundleSecret" (dict
  "name" "spree-db"
  "type" "kubernetes.io/basic-auth"
  "data" (dict "password" "spree_db_password")
  "literals" (dict "username" "spree")
  "context" $) }}
---
{{ include "aypex.bundleSecret" (dict
  "name" "payload-db"
  "type" "kubernetes.io/basic-auth"
  "data" (dict "password" "payload_db_password")
  "literals" (dict "username" "payload")
  "context" $) }}
---
{{- /*
The single Next.js app.

  NEXT_SERVER_ACTIONS_ENCRYPTION_KEY  Pinned from day one. Next mints a fresh
    key per build otherwise, and every deploy then 404s any server action in a
    page a customer already had open -- checkout included.
  SPREE_PUBLISHABLE_KEY  Read at RUNTIME, never a build arg: the image is
    promoted stg -> prd unchanged, so a build-time value would carry staging's
    key into production.
*/}}
{{ include "aypex.bundleSecret" (dict
  "name" "site"
  "data" (dict
    "PAYLOAD_SECRET" "payload_secret"
    "NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" "next_server_actions_encryption_key"
    "SPREE_PUBLISHABLE_KEY" "spree_publishable_key"
    "STRIPE_PUBLISHABLE_KEY" "stripe_publishable_key"
    "REVALIDATE_SECRET" "revalidate_secret")
  "context" $) }}
---
{{- /* Postmark uses the server token as BOTH SMTP username and password. */}}
{{ include "aypex.bundleSecret" (dict
  "name" "smtp"
  "data" (dict
    "SMTP_USERNAME" "smtp_token"
    "SMTP_PASSWORD" "smtp_token")
  "context" $) }}
---
{{- end }}

{{- if .Values.externalSecrets.asmKeys.spreeS3 }}
{{ include "aypex.iamSecret" (dict
  "name" "spree-s3"
  "asmKey" .Values.externalSecrets.asmKeys.spreeS3
  "context" $) }}
---
{{- end }}

{{- if .Values.externalSecrets.asmKeys.mediaS3 }}
{{ include "aypex.iamSecret" (dict
  "name" "media-s3"
  "asmKey" .Values.externalSecrets.asmKeys.mediaS3
  "context" $) }}
---
{{- end }}

{{- if and .Values.cnpg.objectStore.enabled .Values.externalSecrets.asmKeys.cnpgBackup }}
{{ include "aypex.iamSecret" (dict
  "name" "cnpg-backup"
  "asmKey" .Values.externalSecrets.asmKeys.cnpgBackup
  "context" $) }}
---
{{- end }}
