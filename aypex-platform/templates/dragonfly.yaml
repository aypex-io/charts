{{- /*
Dragonfly instances for the Spree backend, managed by the DRAGONFLY OPERATOR
(dragonflydb.io/v1alpha1) rather than hand-rolled Deployments + PVCs.

Two instances, not three. spree-platform carries a third (`redis-cable`) for
tkf's ActionCable surface; this brand has none, and a chart that deploys only
what its consumer uses is easier to reason about than one whose extra
StatefulSet is switched off by a default nobody reads.

Why this replaced the hand-rolled templates:
The operator has been installed on N27a since 2026-06-17, but the chart carried
raw Deployments and a manually-created PVC — reimplementing, worse, what the
operator exists to do. The tell was `replicas: 1` + `strategy: Recreate` on the
queue: that constraint only existed because two pods cannot mount one RWO PVC.
The operator gives each replica its own PVC and handles master election, so the
constraint disappears rather than being worked around.

Service names are pinned via serviceSpec.name so the in-cluster URLs the app
already uses (redis://redis-queue:6379/0 etc.) keep working unchanged.
*/}}
{{- $ns := include "aypex.namespace" . }}
{{- $securityCtx := .Values.dragonfly.securityContext | default dict }}
{{- /*
The operator's default pod does NOT satisfy PodSecurity `restricted`: it sets
no runAsNonRoot, no seccompProfile, drops no capabilities and leaves
allowPrivilegeEscalation unset. In a restricted namespace the StatefulSet is
created and then every pod is REFUSED at admission -- the Dragonfly CR happily
reports "ResourcesCreated" while nothing runs, and the only sign is a
FailedCreate event on the StatefulSet.

Rather than relax the namespace to accommodate it, the CRD's own
podSecurityContext / containerSecurityContext fields are used to make the pod
compliant. Keeps PSA restricted for everything in here.
*/}}

{{- if .Values.redisQueue.enabled }}
{{- /*
QUEUE — the only Dragonfly with durable state (Sidekiq jobs).
Snapshots are operator-managed: it provisions the PVC from
snapshot.persistentVolumeClaimSpec, so the chart no longer creates one.

replicas > 1 gives real failover here. The old single-replica PVC sat on
ceph-block-r1 (size 1, min_size 1) — the same pool whose only-copy-on-the-
draining-node behaviour wedged a Talos node for 90 minutes on 2026-08-02.
*/}}
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: redis-queue
  namespace: {{ $ns }}
  labels: {{- include "aypex.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-queue
spec:
  image: {{ .Values.redisQueue.image.registry }}/{{ .Values.redisQueue.image.repository }}:{{ .Values.redisQueue.image.tag }}
  replicas: {{ .Values.redisQueue.replicaCount }}
  serviceSpec:
    name: redis-queue
  {{- /*
  Prometheus scrape. The metrics endpoint is on the ADMIN port, not 6379: the
  operator sets --primary_port_http_enabled=false, so there is no HTTP (and no
  /metrics) on the redis port. Alloy's annotation job keys on
  prometheus.io/scrape and rewrites the target to pod_ip:prometheus.io/port,
  defaulting the path to /metrics — which is what Dragonfly serves.
  */}}
  {{- with .Values.dragonfly.podAnnotations }}
  podMetadata:
    annotations: {{- toYaml . | nindent 6 }}
  {{- end }}
  args:
    - --logtostderr
    - --proactor_threads={{ .Values.redisQueue.proactorThreads }}
    - --version_check=false
    # Serve /metrics on the redis port. The operator hardcodes
    # --primary_port_http_enabled=false in its own args; ours are appended after
    # its, and gflags takes the LAST occurrence, so this re-enables it.
    # Deliberately NOT the admin port -- see dragonfly.podAnnotations in
    # values.yaml for why that cannot be scraped.
    - --primary_port_http_enabled=true
    # Dragonfly's --dbfilename DEFAULTS to "dump-{timestamp}", so every cron
    # snapshot lands in a NEW file and nothing ever prunes them: there is no
    # retention flag in the binary. aypex-tech-stg filled its 2Gi queue PVC
    # this way on 2026-08-30 (2062 files) and then failed every snapshot for
    # 11 days -- "Failed to perform snapshot No space left on device" -- so a
    # pod restart would have silently dropped the whole Sidekiq queue.
    # A fixed name means ONE overwriting dump set, which is also what startup
    # deterministically reloads. See the runbook's pitfall #2; the operator
    # rewrite dropped this arg because the hand-rolled Deployment used to
    # carry it. The operator supplies --dir, so only the name is needed here.
    - --dbfilename=dump
  snapshot:
    cron: {{ .Values.redisQueue.persistence.snapshotCron | quote }}
    persistentVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      storageClassName: {{ .Values.redisQueue.persistence.storageClass }}
      resources:
        requests:
          storage: {{ .Values.redisQueue.persistence.size }}
  resources: {{- toYaml .Values.redisQueue.resources | nindent 4 }}
  {{- with $securityCtx.pod }}
  podSecurityContext: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $securityCtx.container }}
  containerSecurityContext: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if gt (int .Values.redisQueue.replicaCount) 1 }}
  # Only meaningful with >1 replica; a hard rule on a single replica would make
  # the pod unschedulable if its node were cordoned.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: redis-queue
  pdb:
    maxUnavailable: 1
  {{- end }}
{{- end }}

{{- if .Values.redisCache.enabled }}
---
{{- /*
CACHE — ephemeral by design (--cache_mode with eviction at --maxmemory).
No snapshot block: a cold start repopulates from Postgres, and persisting a
cache would only add restore time. Nothing is lost when this restarts.
*/}}
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: redis-cache
  namespace: {{ $ns }}
  labels: {{- include "aypex.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-cache
spec:
  image: {{ .Values.redisCache.image.registry }}/{{ .Values.redisCache.image.repository }}:{{ .Values.redisCache.image.tag }}
  replicas: {{ .Values.redisCache.replicaCount }}
  serviceSpec:
    name: redis-cache
  {{- /*
  Prometheus scrape. The metrics endpoint is on the ADMIN port, not 6379: the
  operator sets --primary_port_http_enabled=false, so there is no HTTP (and no
  /metrics) on the redis port. Alloy's annotation job keys on
  prometheus.io/scrape and rewrites the target to pod_ip:prometheus.io/port,
  defaulting the path to /metrics — which is what Dragonfly serves.
  */}}
  {{- with .Values.dragonfly.podAnnotations }}
  podMetadata:
    annotations: {{- toYaml . | nindent 6 }}
  {{- end }}
  args:
    - --logtostderr
    - --proactor_threads={{ .Values.redisCache.proactorThreads }}
    - --cache_mode=true
    - --maxmemory={{ .Values.redisCache.maxmemory }}
    - --version_check=false
    # Serve /metrics on the redis port. The operator hardcodes
    # --primary_port_http_enabled=false in its own args; ours are appended after
    # its, and gflags takes the LAST occurrence, so this re-enables it.
    # Deliberately NOT the admin port -- see dragonfly.podAnnotations in
    # values.yaml for why that cannot be scraped.
    - --primary_port_http_enabled=true
  resources: {{- toYaml .Values.redisCache.resources | nindent 4 }}
  {{- with $securityCtx.pod }}
  podSecurityContext: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $securityCtx.container }}
  containerSecurityContext: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
