apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.cnpg.name }}
  namespace: {{ include "revue.namespace" . }}
  labels: {{- include "revue.labels" . | nindent 4 }}
  annotations:
    # After the ExternalSecrets (-10, the bootstrap and role passwords), before the
    # migrate Job (-5) and the Deployments (0). ArgoCD waits for the Cluster to be
    # Healthy (its built-in CNPG health check) before the next wave, so on a fresh
    # install migrate never starts against a database that isn't there yet.
    argocd.argoproj.io/sync-wave: "-8"
spec:
  instances: {{ .Values.cnpg.instances }}
  imageName: {{ .Values.cnpg.imageName }}
  primaryUpdateStrategy: unsupervised
  # Promote an already-updated replica, then restart the old primary as a
  # replica. CNPG's default (`restart`) restarts the primary IN PLACE on an
  # image/config change — revue-prd was write-unavailable ~3.5 min that way on
  # 2026-09-12. With switchover the write gap is seconds. Single-instance
  # clusters (stg) have no replica and still restart in place.
  primaryUpdateMethod: switchover
  # A single-instance cluster (every stg) has no replica to switch over to, so
  # CNPG's `<cluster>-primary` PDB (minAvailable 1) allows 0 disruptions and
  # blocks node drains forever — it stalled the Talos v1.13.10 roll on
  # talos-mfm-260 for 1h+ on 2026-09-13. Disable the PDB when instances == 1
  # (CNPG recommends this for dev/staging); keep it for replicated clusters,
  # where CNPG switches the primary away from a draining node.
  enablePDB: {{ gt (int .Values.cnpg.instances) 1 }}
  enableSuperuserAccess: false
  minSyncReplicas: 0
  maxSyncReplicas: {{ .Values.cnpg.maxSyncReplicas }}
  # Per-instance CNPG metrics (:9187 /metrics) scraped by obs/Alloy via the
  # prometheus.io pod annotations (no PodMonitor CRD on this cluster).
  inheritedMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9187"

  {{- with .Values.cnpg.parameters }}
  postgresql:
    parameters: {{- toYaml . | nindent 6 }}
  {{- end }}

  bootstrap:
    initdb:
      database: {{ .Values.cnpg.database }}
      owner: {{ .Values.cnpg.owner }}
      secret:
        name: {{ .Values.cnpg.ownerPasswordSecret }}

  # The runtime role: a NON-OWNER login the web/worker pods connect as, so RLS
  # engages (a table's owner bypasses RLS). CNPG keeps its password in sync with
  # the ESO-fed secret. DML grants are applied by the migrate Job
  # (db/migrate/*_grant_runtime_app_role), which runs as the owner.
  managed:
    roles:
    - name: {{ .Values.cnpg.appRole }}
      ensure: present
      login: true
      passwordSecret:
        name: {{ .Values.cnpg.appRolePasswordSecret }}
    # The owner, managed only to make it a MEMBER of the runtime role. The worker
    # creates the pgbus queue tables as the runtime role, so it owns them, and a
    # PGMQ upgrade migration (run as the owner) must re-create their NOTIFY
    # triggers, which it can only do with the runtime role's privileges. The runtime
    # role gains nothing: membership runs owner -> runtime only, so RLS still
    # binds the runtime role.
    # Listing a role here ADOPTS it: CNPG forces every attribute to this entry
    # and resets omitted ones to its defaults, and login defaults to FALSE. So
    # login stays explicit, and the rest match bootstrap's `CREATE ROLE <owner>
    # LOGIN`. No passwordSecret (and no disablePassword): the password is left as
    # bootstrap set it.
    - name: {{ .Values.cnpg.owner }}
      ensure: present
      login: true
      inRoles:
      - {{ .Values.cnpg.appRole }}

  storage:
    size: {{ .Values.cnpg.storageSize }}
    storageClass: {{ .Values.cnpg.storageClass }}

  walStorage:
    size: {{ .Values.cnpg.walStorageSize }}
    storageClass: {{ .Values.cnpg.walStorageClass | default .Values.cnpg.storageClass }}

  {{- if .Values.cnpg.objectStore.enabled }}
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: aws-s3
  {{- end }}

  resources: {{- toYaml .Values.cnpg.resources | nindent 4 }}

  {{- with .Values.cnpg.affinity }}
  affinity: {{- toYaml . | nindent 4 }}
  {{- end }}
