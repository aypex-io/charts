{{- if .Values.redisCache.enabled }}
{{- /*
Eviction-tolerant Dragonfly shared by Rails.cache + rack-attack (REDIS_CACHE_URL,
db 1), managed by the DRAGONFLY OPERATOR (dragonflydb.io/v1alpha1) rather than a
hand-rolled Deployment.

Ephemeral by design: --cache_mode + --maxmemory evict LRU under pressure instead
of OOMing, and a cold start repopulates from Postgres. So there is no snapshot
block and no PVC — persisting a cache would only add restore time.

Revue has NO queue or cable Redis: background jobs and realtime streams run on
Postgres/PGMQ (pgbus). This one instance is the whole Redis surface, which is why
a single replica is sufficient — losing it costs a cold cache, never job state.

Service name is pinned via serviceSpec.name to `{release}-redis-cache` so the URL
the app already uses (redis://{release}-redis-cache:6379/1, set in the gitops
base values) keeps working unchanged. Do NOT drop the release prefix here without
changing that env var in the same release — the two must move together.

PSA: revue-{stg,prd} enforce `restricted`, unlike the tkf namespaces which are
`privileged`. The operator's DEFAULT pod spec does not satisfy restricted (it
sets only fsGroup, with no runAsNonRoot, no dropped capabilities and no seccomp
profile), so those pods are REJECTED AT ADMISSION — the StatefulSet appears with
zero pods and the only signal is a PSA message on the ReplicaSet/StatefulSet
event, not on any pod. The two securityContext blocks below are what make this
admissible; they carry over the exact values the previous Deployment ran with.
*/}}
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: redis-cache
  namespace: {{ include "revue.namespace" . }}
  labels: {{- include "revue.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-cache
spec:
  image: {{ .Values.dragonfly.image.registry }}/{{ .Values.dragonfly.image.repository }}:{{ .Values.dragonfly.image.tag }}
  replicas: {{ .Values.redisCache.replicaCount }}
  serviceSpec:
    name: {{ .Release.Name }}-redis-cache
  args:
    - --logtostderr
    - --proactor_threads={{ .Values.redisCache.proactorThreads }}
    - --version_check=false
    - --cache_mode=true
    - --maxmemory={{ .Values.redisCache.maxmemory }}
  {{- /* Keeps the annotation-based Prometheus scrape the Deployment had. */}}
  podMetadata:
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "6379"
      prometheus.io/path: /metrics
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  resources: {{- toYaml .Values.redisCache.resources | nindent 4 }}
{{- end }}
