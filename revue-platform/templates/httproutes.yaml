{{- $ns := include "revue.namespace" . -}}
{{- $release := .Release.Name -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $release }}-admin
  namespace: {{ .Values.gateway.namespace }}
  labels: {{- include "revue.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range (.Values.gateway.sectionNames.admin | default .Values.gateway.sectionNames.reviews) }}
    - name: {{ $.Values.gateway.name }}
      sectionName: {{ . }}
    {{- end }}
  hostnames:
    - {{ .Values.hostnames.admin | quote }}
  rules:
    - backendRefs:
        - name: {{ $release }}-web
          namespace: {{ $ns }}
          port: 80
{{- /* A preview serves admin and API on one host: a second route for the same
host would be redundant, and Gateway API would pick between them by age. */}}
{{- if ne .Values.hostnames.api .Values.hostnames.admin }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $release }}-api
  namespace: {{ .Values.gateway.namespace }}
  labels: {{- include "revue.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range (.Values.gateway.sectionNames.api | default .Values.gateway.sectionNames.reviews) }}
    - name: {{ $.Values.gateway.name }}
      sectionName: {{ . }}
    {{- end }}
  hostnames:
    - {{ .Values.hostnames.api | quote }}
  rules:
    - backendRefs:
        - name: {{ $release }}-web
          namespace: {{ $ns }}
          port: 80
{{- end }}
{{- if .Values.hostnames.public }}
---
# Per-store public reviews sites (<store-handle>.revue.fyi). Wildcard host; Gateway
# API matches the most-specific host first, so the admin/api routes above still win
# their exact hosts and everything else lands on the same web backend (the app
# resolves the store from the host). PRD only — stg can't co-own *.revue.fyi.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $release }}-public
  namespace: {{ .Values.gateway.namespace }}
  labels: {{- include "revue.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range (.Values.gateway.sectionNames.public | default .Values.gateway.sectionNames.reviews) }}
    - name: {{ $.Values.gateway.name }}
      sectionName: {{ . }}
    {{- end }}
  hostnames:
    - {{ .Values.hostnames.public | quote }}
  rules:
    - backendRefs:
        - name: {{ $release }}-web
          namespace: {{ $ns }}
          port: 80
{{- end }}
{{- if .Values.hostnames.marketing }}
---
# The marketing site (revue.fyi): landing page plus the legal pages, served by the
# same web backend, which recognises the host via MARKETING_HOST. The apex needs its
# own listener (a *.revue.fyi listener doesn't match the bare domain), so prd sets
# gateway.sectionNames.marketing.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $release }}-marketing
  namespace: {{ .Values.gateway.namespace }}
  labels: {{- include "revue.labels" . | nindent 4 }}
spec:
  parentRefs:
    {{- range (.Values.gateway.sectionNames.marketing | default .Values.gateway.sectionNames.reviews) }}
    - name: {{ $.Values.gateway.name }}
      sectionName: {{ . }}
    {{- end }}
  hostnames:
    - {{ .Values.hostnames.marketing | quote }}
  rules:
    - backendRefs:
        - name: {{ $release }}-web
          namespace: {{ $ns }}
          port: 80
{{- end }}
