name: PR lint

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.0
      - name: Lint and template each chart
        run: |
          set -euo pipefail
          # The umbrellas are linted here too. Their OCI dependencies are
          # public, so `helm dependency update` works before any GHCR login --
          # and a template parse error in an umbrella otherwise stays hidden
          # until someone cuts a release tag.
          for chart in rails-server rails-task nextjs spree-platform revue-platform aypex-platform; do
            echo "==> $chart"
            cd "$chart"
            helm dependency update
            helm lint .
            for f in ci/*-values.yaml; do
              echo "    helm template -f $f"
              helm template ci-release . -f "$f" > /tmp/rendered.yaml
              ../.github/check-separators.sh /tmp/rendered.yaml
            done
            cd ..
          done
      - name: Preview releases don't collide (revue-platform)
        # Every Revue preview is its own release in the shared revue-preview
        # namespace. Renders two and fails on any shared object name. Uses the
        # deps fetched above; yq is preinstalled on ubuntu runners.
        run: bash revue-platform/ci/check-preview-releases.sh
