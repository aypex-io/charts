{{- if .Values.typesense.enabled }}
{{- /*
Typesense — managed by the Typesense Kubernetes Operator (TyKO),
github.com/akyriako/typesense-operator, apiVersion ts.opentelekomcloud.com/v1alpha1.

WHY AN OPERATOR (2026-08-22)
This template used to hand-roll the StatefulSet, the two Services, the nodes
ConfigMap and the PVC retention policy. braft wedged three times in three weeks
and each fix closed the previous trigger while opening the next:

  1. #45 (2026-08-02) — StatefulSet deleted, PVCs retained with a stale peer set.
     Fixed with persistentVolumeClaimRetentionPolicy.
  2. #50 (2026-08-18) — a power outage brought all 3 pods back on new IPs; braft
     had persisted the RESOLVED peer set, so no node could pre_vote and no leader
     existed to reset it. Fixed with --reset-peers-on-error=true.
  3. 2026-08-22 — caused BY that flag. The Talos v1.13.9 roll rebooted a node;
     tkf-prd/typesense-0 hit a clustering error, reset its peer set to ITSELF
     ALONE, self-elected leader of a one-node group and diverged its log. The
     real leader walked prev_log_index backwards until truncation hit a braft
     CHECK and aborted. Crash-loops in braft::LogManager::unsafe_truncate_suffix
     and does NOT self-heal — each restart re-elects and bumps the term.

--reset-peers-on-error is safe for a whole-cluster restart with all-new IPs and
UNSAFE for one pod restarting into a healthy quorum — which is what every rolling
node reboot produces, i.e. every Talos bump. Quorum logic does not belong in a
Helm template; it belongs in a controller that can observe cluster state.

TyKO probes each node's /status, classifies the cluster OK / SPLIT_BRAIN /
NOT_READY / ELECTION_DEADLOCK, and recovers by scaling the StatefulSet down to a
single node and then gradually back up — the manual manoeuvre, automated.

NOT OFFICIAL, deliberately: Typesense ships no operator and no Helm chart
(typesense/typesense-kubernetes is kustomize-only, last pushed 2023-09-21). TyKO
is GPL-3.0, CRD v1alpha1, effectively one maintainer. Accepted 2026-08-22 as the
only thing that manages this quorum. The operator itself is terraform-owned
(infra: ot-modules/k8s/typesense-operator, installed cluster-wide from
tg_cluster-landscaping); this chart owns only the CR.

WHAT THE OPERATOR NAMES THINGS — these are fixed suffixes, not our choice:
  REST Service (what the backend hits) : typesense-svc      <- global.typesenseUrl
  headless peering Service             : typesense-sts-svc
  StatefulSet                          : typesense-sts
  nodes ConfigMap                      : typesense-nodeslist
The client Service is NO LONGER `typesense`. global.typesenseUrl MUST address
typesense-svc. spree.rb selects the provider on TYPESENSE_URL.present?, so a URL
that is set but wrong does not fail loudly — the Typesense provider stays
selected and search silently breaks. Verify with a real query, not pod readiness.

THE 64-CHARACTER PEER LIMIT still applies and is still why the CR is named
`typesense` and not release-prefixed. Raft rejects any peer hostname >= 64 chars
("Host name is too long"), and the symptom is pods Running but never Ready, which
points nowhere near DNS. TyKO builds peers as `<name>-sts-<i>.<name>-sts-svc`
with no namespace and no cluster suffix — 33 chars here, a constant independent
of release name and namespace. It also enforces the limit itself and fails with a
clear error rather than producing a broken cluster.
*/}}
apiVersion: ts.opentelekomcloud.com/v1alpha1
kind: TypesenseCluster
metadata:
  name: typesense
  namespace: {{ include "spree-store.namespace" . }}
  labels: {{- include "spree-store.labels" . | nindent 4 }}
    app.kubernetes.io/component: typesense
spec:
  image: {{ .Values.typesense.image.registry }}/{{ .Values.typesense.image.repository }}:{{ .Values.typesense.image.tag }}
  {{- /* Raft sizes: the CRD accepts only 1, 3, 5 or 7. */}}
  replicas: {{ .Values.typesense.replicaCount }}
  enableCors: true

  {{- /*
  The admin API key. TyKO reads the Secret named here and expects the data key
  `typesense-api-key` inside it (ClusterAdminApiKeySecretKeyName) — that is a
  KUBERNETES Secret data key, NOT the ASM bundle key, which stays
  `typesense_api_key`. See templates/externalsecrets.yaml, which now projects the
  same ASM value under both TYPESENSE_API_KEY (for the Rails backend) and
  typesense-api-key (for the operator).

  Do NOT omit this: with no adminApiKey the operator GENERATES a random key into
  an Immutable Secret, and the backend has no way to learn it.
  */}}
  adminApiKey:
    name: {{ include "spree-store.resourceName" (dict "ctx" . "suffix" "spree-rails") }}
    namespace: {{ include "spree-store.namespace" . }}

  {{- /*
  MUST be ceph-block (size 3), NEVER ceph-block-r1 (size 1, min_size 1). A
  size-1 pool is what turned a node drain into an unrecoverable unmount hang on
  2026-08-02: the node stopped its own OSD while a pod on it still held an RBD
  mount whose only copy lived there, so the unmount blocked forever and machined
  refused every reboot ("reboot failed: locked"). No BMC on N27a — that is a
  physical trip to the rack.
  */}}
  storage:
    size: {{ .Values.typesense.persistence.size }}
    storageClassName: {{ .Values.typesense.persistence.storageClass }}
    accessMode: ReadWriteOnce

  {{- /*
  resetPeersOnError defaults to TRUE in the CRD. We force it FALSE: that flag is
  exactly what split-brained tkf-prd on 2026-08-22 (see above). The operator's
  own SPLIT_BRAIN detection and scale-to-one recovery is the correct mechanism —
  it observes the whole cluster, where a single node resetting its own membership
  cannot tell "everyone moved" from "only I restarted".
  */}}
  resetPeersOnError: false
  {{- /* Re-add nodes one at a time after a recovery instead of all at once. */}}
  incrementalQuorumRecovery: true

  {{- /*
  HARD one-pod-per-node. Two replicas on one node means a single node reboot
  takes down 2 of 3 and Raft loses quorum — the HA would be decorative, which is
  the failure this whole component exists to avoid. whenUnsatisfiable
  DoNotSchedule is the hard form; TyKO injects the labelSelector (app:
  typesense-sts) when it is omitted, so do not hand-write one.
  */}}
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule

  {{- /* N27a enforces PodSecurity `restricted` on tenant namespaces. */}}
  securityContext:
    pod:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    typesense:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    healthcheck:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]

  resources: {{- toYaml .Values.typesense.resources | nindent 4 }}
{{- end }}
